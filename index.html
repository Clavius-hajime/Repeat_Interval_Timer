<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Repeat Interval Timer</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #ffffff;
    }

    main {
      width: min(620px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 1.45rem;
    }

    #display {
      margin: 18px 0;
      font-size: clamp(5rem, 28vw, 10rem);
      font-weight: 800;
      line-height: 1;
    }

    #message {
      min-height: 1.5em;
      font-size: 1.15rem;
      opacity: 0.9;
    }

    .settings,
    .voice-control,
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .settings {
      margin: 24px 0 10px;
    }

    .voice-control {
      margin: 8px 0 22px;
    }

    input {
      width: 100px;
      padding: 10px;
      border: 1px solid #6b7280;
      border-radius: 12px;
      background: #1f2937;
      color: #ffffff;
      font-size: 1.3rem;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .voice-control button {
      min-width: 150px;
    }

    #start {
      background: #ffffff;
      color: #111827;
    }

    #stop {
      background: #374151;
      color: #ffffff;
    }

    .status {
      margin-top: 22px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <main>
    <h1>Repeat Interval Timer</h1>

    <div id="display">20</div>
    <div id="message">READY</div>

    <div class="settings">
      <label for="interval">Interval</label>
      <input id="interval" type="number" min="6" step="1" value="20">
      <span>sec</span>
    </div>

    <div class="voice-control">
      <span>Voice countdown</span>
      <button id="voiceToggle" type="button" aria-pressed="true">ON</button>
    </div>

    <div class="buttons">
      <button id="start" type="button">START</button>
      <button id="stop" type="button" disabled>STOP</button>
    </div>

    <div class="status" id="wake">Screen wake lock: Not started</div>
  </main>

    let audioContext = null;
    let voiceBuffers = {};
    let voiceLoadingPromise = null;
    let voiceReady = false;

    let wakeLock = null;
    let animationFrameId = null;

    let running = false;
    let initialCountdown = true;
    let intervalSeconds = CONFIG.defaultIntervalSeconds;
    let phaseStartTime = 0;
    let lastSpokenNumber = null;
    let voiceEnabled = true;

    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
      }
      return audioContext;
    }

    function dataUrlToArrayBuffer(dataUrl) {
      const base64 = dataUrl.split(",")[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes.buffer;
    }

    async function prepareVoiceAudio() {
      if (voiceReady) return;
      if (voiceLoadingPromise) return voiceLoadingPromise;

      const context = getAudioContext();

      voiceLoadingPromise = Promise.all(
        Object.entries(voiceAudioData).map(async ([number, dataUrl]) => {
          const arrayBuffer = dataUrlToArrayBuffer(dataUrl);
          voiceBuffers[number] = await context.decodeAudioData(arrayBuffer);
        })
      ).then(() => {
        voiceReady = true;
      });

      return voiceLoadingPromise;
    }

    function playSilentUnlockSound() {
      const context = getAudioContext();
      const buffer = context.createBuffer(1, 1, context.sampleRate);
      const source = context.createBufferSource();

      source.buffer = buffer;
      source.connect(context.destination);
      source.start(0);
    }

    function playVoice(number) {
      if (!voiceEnabled || !voiceReady || !voiceBuffers[number]) return;

      try {
        const context = getAudioContext();
        const source = context.createBufferSource();
        const gain = context.createGain();

        source.buffer = voiceBuffers[number];
        gain.gain.value = CONFIG.voiceVolume;

        source.connect(gain);
        gain.connect(context.destination);
        source.start(0);
      } catch (error) {
        console.error("Voice playback failed:", error);
      }
    }

    function playBeep() {
      const context = getAudioContext();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const now = context.currentTime;

      oscillator.frequency.value = CONFIG.beepFrequencyHz;

      gain.gain.setValueAtTime(CONFIG.beepVolume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + CONFIG.beepDurationSeconds);

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start(now);
      oscillator.stop(now + CONFIG.beepDurationSeconds);
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) {
        elements.wakeStatus.textContent = "Screen wake lock: Not supported";
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request("screen");
        elements.wakeStatus.textContent = "Screen wake lock: ON";

        wakeLock.addEventListener("release", () => {
          elements.wakeStatus.textContent = "Screen wake lock: OFF";
        });
      } catch (error) {
        elements.wakeStatus.textContent = "Screen wake lock: Unavailable";
      }
    }

    async function releaseWakeLock() {
      if (!wakeLock) return;

      try {
        await wakeLock.release();
      } catch (error) {
        console.error("Wake lock release failed:", error);
      } finally {
        wakeLock = null;
      }
    }

    function normalizeIntervalSeconds(value) {
      const parsed = Number(value);

      if (!Number.isFinite(parsed)) {
        return CONFIG.defaultIntervalSeconds;
      }

      return Math.max(CONFIG.minimumIntervalSeconds, Math.floor(parsed));
    }

    function updateIdleDisplay() {
      if (running) return;

      if (elements.intervalInput.value === "") {
        elements.display.textContent = "--";
        return;
      }

      const value = Number(elements.intervalInput.value);

      if (Number.isFinite(value) && value >= CONFIG.minimumIntervalSeconds) {
        elements.display.textContent = String(Math.floor(value));
      }
    }

    function setControlsForRunning(isRunning) {
      elements.startButton.disabled = isRunning;
      elements.stopButton.disabled = !isRunning;
      elements.intervalInput.disabled = isRunning;
    }

    function completeCurrentPhase(now) {
      playBeep();

      if (initialCountdown) {
        initialCountdown = false;
        elements.message.textContent = "START";
      } else {
        elements.message.textContent = "BEEP";
      }

      phaseStartTime = now;
      lastSpokenNumber = null;
    }

    function tick() {
      if (!running) return;

      const now = performance.now();
      const totalSeconds = initialCountdown
        ? CONFIG.countdownSeconds
        : intervalSeconds;

      const elapsedSeconds = (now - phaseStartTime) / 1000;
      const remainingSeconds = totalSeconds - elapsedSeconds;
      const shownSeconds = Math.max(0, Math.ceil(remainingSeconds));

      elements.display.textContent = String(shownSeconds);
      elements.message.textContent = initialCountdown
        ? "Until start"
        : "Until next beep";

      if (remainingSeconds > 0 && remainingSeconds <= CONFIG.countdownSeconds) {
        const targetNumber = Math.ceil(remainingSeconds);
        const boundarySeconds = totalSeconds - targetNumber;

        if (
          targetNumber >= 1 &&
          targetNumber <= CONFIG.countdownSeconds &&
          targetNumber !== lastSpokenNumber &&
          elapsedSeconds >= boundarySeconds - 0.03
        ) {
          lastSpokenNumber = targetNumber;
          playVoice(targetNumber);
        }
      }

      if (remainingSeconds <= 0) {
        completeCurrentPhase(now);
      }

      animationFrameId = requestAnimationFrame(tick);
    }

    async function startTimer() {
      intervalSeconds = normalizeIntervalSeconds(elements.intervalInput.value);
      elements.intervalInput.value = String(intervalSeconds);

      const context = getAudioContext();
      await context.resume();

      elements.message.textContent = "LOADING VOICE";

      try {
        await prepareVoiceAudio();
      } catch (error) {
        console.error("Voice audio could not be decoded:", error);
      }

      playSilentUnlockSound();
      setControlsForRunning(true);

      elements.message.textContent = "GET READY";
      requestWakeLock();

      window.setTimeout(() => {
        if (elements.stopButton.disabled) return;

        running = true;
        initialCountdown = true;
        phaseStartTime = performance.now();
        lastSpokenNumber = CONFIG.countdownSeconds;

        elements.display.textContent = String(CONFIG.countdownSeconds);
        elements.message.textContent = "Until start";

        playVoice(CONFIG.countdownSeconds);
        tick();
      }, CONFIG.startPrerollMilliseconds);
    }

    async function stopTimer() {
      running = false;

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      setControlsForRunning(false);
      elements.display.textContent = elements.intervalInput.value || "--";
      elements.message.textContent = "READY";

      await releaseWakeLock();
    }

    function toggleVoiceCountdown() {
      voiceEnabled = !voiceEnabled;

      elements.voiceToggle.textContent = voiceEnabled ? "ON" : "OFF";
      elements.voiceToggle.setAttribute("aria-pressed", String(voiceEnabled));
    }

    elements.intervalInput.addEventListener("input", updateIdleDisplay);
    elements.voiceToggle.addEventListener("click", toggleVoiceCountdown);
    elements.startButton.addEventListener("click", startTimer);
    elements.stopButton.addEventListener("click", stopTimer);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && running) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
