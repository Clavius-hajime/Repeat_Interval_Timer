<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Repeat Interval Timer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px}
main{width:min(620px,100%);text-align:center}
h1{font-size:1.45rem;margin:0 0 24px}
#display{font-size:clamp(5rem,28vw,10rem);font-weight:800;line-height:1;margin:18px 0}
#message{font-size:1.15rem;min-height:1.5em;opacity:.9}
.settings{display:flex;justify-content:center;align-items:center;gap:10px;margin:24px 0}
input{width:100px;font-size:1.3rem;padding:10px;border-radius:12px;border:1px solid #6b7280;background:#1f2937;color:#fff;text-align:center}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.toggle{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 22px}
.toggle button{min-width:150px}
button{border:0;border-radius:14px;padding:14px 24px;font-size:1.15rem;font-weight:700;cursor:pointer}
#start{background:#fff;color:#111827}
#stop{background:#374151;color:#fff}
.status{margin-top:22px;font-size:.9rem;opacity:.7}
</style>
</head>
<body>
<main>
<h1>Repeat Interval Timer</h1>
<div id="display">20</div>
<div id="message">READY</div>

<div class="settings">
<label for="interval">Interval</label>
<input id="interval" type="number" min="6" step="1" value="20">
<span>sec</span>
</div>

<div class="toggle">
<span>Voice countdown</span>
<button id="voiceToggle" type="button">ON</button>
</div>

<div class="buttons">
<button id="start">START</button>
<button id="stop" disabled>STOP</button>
</div>
<div class="status" id="wake">Screen wake lock: Not started</div>
</main>

<script>
const display=document.getElementById('display');
const message=document.getElementById('message');
const intervalInput=document.getElementById('interval');
const startBtn=document.getElementById('start');
const stopBtn=document.getElementById('stop');
const wakeText=document.getElementById('wake');
const voiceToggle=document.getElementById('voiceToggle');

let running=false, timer=null, wakeLock=null;
let intervalSec=20, phaseStart=0, initial=true, lastSpoken=null;
let voiceEnabled=true;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.frequency.value=1000; g.gain.value=.38;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+.13);
}
function speak(n){
  if(!voiceEnabled || !('speechSynthesis' in window)) return;

  // Do not call speechSynthesis.cancel() here.
  // Reinitializing the speech engine before every number can clip the first
  // phoneme, especially the "F" in "Five" after a silent interval.
  speechSynthesis.resume();

  const text = (n===5) ? ', Five' : String(n);
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate=1.0;
  u.volume=1;
  speechSynthesis.speak(u);
}
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeText.textContent='Screen wake lock: ON';
      wakeLock.addEventListener('release',()=>wakeText.textContent='Screen wake lock: OFF');
    }else wakeText.textContent='Screen wake lock: Not supported';
  }catch(e){wakeText.textContent='Screen wake lock: Unavailable';}
}
async function releaseWakeLock(){
  if(wakeLock){try{await wakeLock.release()}catch(e){} wakeLock=null;}
}

function tick(){
  if(!running) return;

  const now = performance.now();
  const totalSec = initial ? 5 : intervalSec;
  const elapsedSec = (now - phaseStart) / 1000;
  const remainingSec = totalSec - elapsedSec;

  // Display uses ceiling, but speech is triggered against fixed time marks.
  const shown = Math.max(0, Math.ceil(remainingSec));
  display.textContent = shown;
  message.textContent = initial ? 'Until start' : 'Until next beep';

  // Speak 5,4,3,2,1 at their exact countdown boundaries.
  // In particular, "One" is fired when exactly 1.0 second remains.
  if (voiceEnabled && remainingSec > 0 && remainingSec <= 5) {
    const target = Math.ceil(remainingSec);
    if (target >= 1 && target <= 5 && target !== lastSpoken) {
      const boundary = totalSec - target;
      // Small tolerance for requestAnimationFrame timing.
      if (elapsedSec >= boundary - 0.03) {
        lastSpoken = target;
        speak(target);
      }
    }
  }

  if (remainingSec <= 0) {
    beep();

    if (initial) {
      message.textContent = 'START';
      initial = false;
    } else {
      message.textContent = 'BEEP';
    }

    // Start the next interval from the actual beep time so the cadence remains
    // stable and "One" always has a full second before the following beep.
    phaseStart = now;
    lastSpoken = null;
  }

  timer = requestAnimationFrame(tick);
}


intervalInput.addEventListener('input',()=>{
  const value=Number(intervalInput.value);
  if(!running && Number.isFinite(value) && value>=6){
    display.textContent=Math.floor(value);
  }else if(!running && intervalInput.value===''){
    display.textContent='--';
  }
});

voiceToggle.setAttribute('aria-pressed', 'true');
voiceToggle.addEventListener('click',()=>{
  voiceEnabled=!voiceEnabled;
  voiceToggle.textContent=voiceEnabled?'ON':'OFF';
  voiceToggle.setAttribute('aria-pressed', String(voiceEnabled));

  if(!voiceEnabled && 'speechSynthesis' in window){
    speechSynthesis.cancel();
  }
});

startBtn.onclick=async()=>{
  intervalSec=Math.max(6,Number(intervalInput.value)||20);
  intervalInput.value=intervalSec;
  await audioCtx.resume();

  startBtn.disabled=true;
  stopBtn.disabled=false;
  intervalInput.disabled=true;
  message.textContent='GET READY';
  requestWakeLock();

  // Give the browser/audio system a short pre-roll before the first spoken
  // number. This avoids the first word ("Five") being clipped or mistimed.
  if('speechSynthesis' in window) speechSynthesis.cancel();

  setTimeout(()=>{
    if(stopBtn.disabled) return;

    running=true;
    initial=true;
    phaseStart=performance.now();
    lastSpoken=5;

    display.textContent='5';
    message.textContent='Until start';

    // Start with the same speech path used by every interval countdown.
    if(voiceEnabled) speak(5);
    tick();
  },800);
};
stopBtn.onclick=async()=>{
  running=false;
  if(timer)cancelAnimationFrame(timer);
  speechSynthesis?.cancel();
  startBtn.disabled=false; stopBtn.disabled=true; intervalInput.disabled=false;
  display.textContent=intervalInput.value || '--';
  message.textContent='READY';
  await releaseWakeLock();
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && running) requestWakeLock();
});
</script>
</body>
</html>
